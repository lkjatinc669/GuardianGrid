<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none">

  <!-- Gradient -->
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path
    d="M60 10 L100 25 V55 
       C100 80 80 100 60 110 
       C40 100 20 80 20 55 
       V25 Z"
    stroke="url(#gg)"
    stroke-width="4"
    fill="none"
  />

  <!-- Inner Shield -->
  <path
    d="M60 22 L88 34 V55 
       C88 74 74 88 60 96 
       C46 88 32 74 32 55 
       V34 Z"
    stroke="#64748B"
    stroke-width="2"
    fill="none"
  />

  <!-- Proper G (circular + cut) -->
  <circle
    cx="60"
    cy="60"
    r="20"
    stroke="url(#gg)"
    stroke-width="2"
    fill="none"
  />

  <!-- G opening -->
  <path
    d="M60 60 H80"
    stroke="url(#gg)"
    stroke-width="4"
    stroke-linecap="round"
  />


</svg>